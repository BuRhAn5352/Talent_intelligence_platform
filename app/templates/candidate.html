<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Analysis</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Back</a>
        <h1>Resume Analysis</h1>
        <p class="subtitle">Upload your resume to get role fit, salary range, and skill gaps</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="form-card">
            <form action="/candidate/analyze" method="post" enctype="multipart/form-data" id="candidateForm">
                <div class="upload-area">
                    <input type="file" name="file" id="file" accept=".pdf,.docx" required>
                    <label for="file">
                        <div class="upload-icon">↑</div>
                        <div>Drop your resume here or click to browse</div>
                        <div class="upload-hint">PDF or DOCX</div>
                    </label>
                </div>

                <div id="exp-error" class="error" style="display:none; margin-bottom: 12px;">
                    Max experience cannot be less than minimum.
                </div>

                <div class="form-fields">
                    <div class="field">
                        <label>Min experience (yrs) <span class="optional">optional</span></label>
                        <input type="number" name="min_exp" id="min_exp" min="0" max="30" placeholder="0">
                    </div>
                    <div class="field">
                        <label>Max experience (yrs) <span class="optional">optional</span></label>
                        <input type="number" name="max_exp" id="max_exp" min="0" max="30" placeholder="5">
                    </div>
                    <div class="field">
                        <label>Skill area <span class="optional">optional</span></label>
                        <select name="skill_category">
                            <option value="">Select area</option>
                            <option value="application programming">Application Programming</option>
                            <option value="web development">Web Development</option>
                            <option value="mobile">Mobile Development</option>
                            <option value="qa testing">QA & Testing</option>
                            <option value="network administration">Network Administration</option>
                            <option value="accounts">Accounts & Finance</option>
                            <option value="financial services">Financial Services</option>
                            <option value="sales">Sales</option>
                            <option value="marketing">Marketing</option>
                            <option value="hr">Human Resources</option>
                            <option value="teaching">Teaching</option>
                            <option value="medical">Medical</option>
                            <option value="analytics business intelligence">Analytics & BI</option>
                            <option value="erp">ERP</option>
                            <option value="design">Design</option>
                            <option value="legal">Legal</option>
                            <option value="strategy">Strategy</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Analyze Resume</button>
            </form>
        </div>
    </div>
<script>
    document.getElementById('file').addEventListener('change', function() {
        const label = this.nextElementSibling;
        if (this.files.length > 0)
            label.querySelector('div:nth-child(2)').textContent = this.files[0].name;
    });
    document.getElementById('candidateForm').addEventListener('submit', function(e) {
        const min = document.getElementById('min_exp').value;
        const max = document.getElementById('max_exp').value;
        const errBox = document.getElementById('exp-error');
        if (min !== '' && max !== '' && parseInt(max) < parseInt(min)) {
            e.preventDefault();
            errBox.style.display = 'block';
            return;
        }
        errBox.style.display = 'none';
    });
</script>
</body>
</html>
